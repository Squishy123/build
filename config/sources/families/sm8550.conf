declare -g LINUXFAMILY="sm8550"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g ARCH="arm64"
declare -g BOOTENV_FILE="qcom-abl.txt"
enable_extension "image-output-abl"

case $BRANCH in

	current)
		declare -g KERNEL_MAJOR_MINOR="6.12" # Major and minor versions of this kernel.
		declare -g KERNELBRANCH='branch:linux-6.12.y'
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="6.13" # Major and minor versions of this kernel.
		declare -g KERNELBRANCH='branch:linux-6.13.y'
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		;;

	ayn)
		declare -g KERNEL_MAJOR_MINOR="6.17"  # Adjust to match AYN's kernel version
		declare -g KERNELBRANCH='branch:sm8550/v6.17.5'  # Or the specific branch name
		declare -g KERNELSOURCE='https://github.com/AYNTechnologies/linux.git'
		;;

esac

family_tweaks_bsp() {
	:
}
